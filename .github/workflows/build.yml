name: Build e site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        visual: [filtro-popup, segmentacao, matriz, piramide, card-comparativo, barras-ranking, colunas-linha]
    defaults:
      run:
        working-directory: visuals/${{ matrix.visual }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: visuals/${{ matrix.visual }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - run: npx pbiviz package
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.visual }}-pbiviz
          path: visuals/${{ matrix.visual }}/dist/*.pbiviz

  # Publica a página de download no GitHub Pages (só na branch main).
  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: node site/build.mjs artifacts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
